[package]
name = "rust-remote-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An attended remote desktop prototype for Windows and Linux"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0"
ctrlc = "3.5"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
snow = { version = "0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
